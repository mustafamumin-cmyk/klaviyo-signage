<title>Cloud Canteen ÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂ· This Week</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 1080px; height: 1920px; overflow: hidden; background: #0C0C0C;
  font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
  cursor: pointer; user-select: none; -webkit-user-select: none;
}
#stage { width: 1080px; height: 1920px; position: relative; overflow: hidden; }

/* SLIDE */
.slide {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  opacity: 0; transform: translateY(48px); pointer-events: none;
  transition: opacity 0.55s cubic-bezier(0.22,1,0.36,1), transform 0.55s cubic-bezier(0.22,1,0.36,1);
}
.slide.active  { opacity: 1; transform: translateY(0); pointer-events: all; }
.slide.leaving { opacity: 0; transform: translateY(-48px); transition: opacity 0.4s ease, transform 0.4s ease; }

/* Day accent colours ÃÂÃÂÃÂÃÂ¢ÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂ assigned dynamically via --accent CSS var */
#stage { --accent: #FF4347; }

/* TOP BAR */
.top-bar { display: flex; align-items: center; justify-content: space-between; padding: 52px 80px 0; flex-shrink: 0; }
.kl-logo { height: 26px; }
.top-right { display: flex; align-items: center; gap: 20px; }
.week-tag { font-size: 17px; letter-spacing: 0.22em; text-transform: uppercase; color: #ffffff; font-weight: 800; }
.top-bar-divider { width: 1px; height: 22px; background: rgba(255,255,255,0.15); flex-shrink: 0; }
.feedr-logo-top { height: 32px; width: auto; opacity: 1; }

/* DAY HERO */
.day-hero { padding: 58px 80px 0; flex-shrink: 0; }
.eyebrow {
  font-size: 15px; letter-spacing: 0.24em; text-transform: uppercase;
  color: var(--accent); font-weight: 700; margin-bottom: 16px;
  opacity: 0; transform: translateX(-14px);
  transition: opacity 0.45s 0.1s ease, transform 0.45s 0.1s ease;
}
.slide.active .eyebrow { opacity: 1; transform: translateX(0); }
.day-name {
  font-family: 'Bebas Neue', sans-serif; font-size: 230px; line-height: 0.87;
  color: #fff; letter-spacing: 0.01em; white-space: nowrap;
  display: inline-block; transform-origin: left center;
  opacity: 0; transition: opacity 0.45s 0.06s ease;
}
.slide.active .day-name { opacity: 1; }
.day-feedr-below {
  display: flex; align-items: center; justify-content: center; gap: 16px;
  margin-top: 12px;
  opacity: 0; transform: translateY(10px);
  transition: opacity 0.45s 0.2s ease, transform 0.45s 0.2s ease;
}
.slide.active .day-feedr-below { opacity: 1; transform: translateY(0); }
.day-feedr-on-text {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 32px; letter-spacing: 0.06em; text-transform: lowercase;
  color: rgba(255,255,255,0.8); font-weight: 700;
}
.feedr-logo-inline { height: 48px; width: auto; }
.day-date {
  font-size: 34px; font-weight: 800; color: var(--accent); margin-top: 20px;
  letter-spacing: -0.02em; opacity: 0; transform: translateX(-14px);
  transition: opacity 0.45s 0.18s ease, transform 0.45s 0.18s ease;
}
.slide.active .day-date { opacity: 1; transform: translateX(0); }

/* DIVIDER */
.divider-wrap { padding: 46px 80px 0; flex-shrink: 0; }
.divider { height: 1px; background: rgba(255,255,255,0.06); position: relative; }
.divider::after {
  content: ''; position: absolute; left: 0; top: -1px;
  width: 0; height: 3px; background: var(--accent); border-radius: 2px;
  transition: width 0.65s 0.28s cubic-bezier(0.22,1,0.36,1);
}
.slide.active .divider::after { width: 160px; }

/* VENDORS */
.vendors-section { flex: 1; display: flex; flex-direction: column; padding: 40px 80px 0; min-height: 0; }
.vendors-label { font-size: 24px; letter-spacing: 0.08em; text-transform: uppercase; color: #ffffff; font-weight: 800; margin-bottom: 40px; margin-top: 80px; flex-shrink: 0; text-align: center; width: 100%; }
.feedr-logo { height: 68px; width: auto; opacity: 1; display: inline-block; flex-shrink: 0; }
.vendors-grid { flex: 1; display: flex; align-items: center; justify-content: center; gap: 36px; min-height: 0; }

/* VENDOR CARD */
.vendor-card {
  display: flex; flex-direction: column; align-items: center; gap: 28px;
  flex: 1; max-width: 290px;
  opacity: 0.38; transform: scale(0.93); filter: saturate(0.3) brightness(0.8);
  transition: opacity 0.55s cubic-bezier(0.34,1.56,0.64,1),
              transform 0.55s cubic-bezier(0.34,1.56,0.64,1),
              filter 0.55s ease;
}
.vendors-grid.count-2 .vendor-card { max-width: 360px; }
.vendor-card.entering { opacity: 0; transform: scale(0.7) translateY(50px); transition: none; }
.vendor-card.popping  { opacity: 0.38; transform: scale(0.93); filter: saturate(0.3) brightness(0.8);
  transition: opacity 0.5s cubic-bezier(0.34,1.56,0.64,1), transform 0.5s cubic-bezier(0.34,1.56,0.64,1), filter 0.5s ease; }
.vendor-card.lit {
  opacity: 1; transform: scale(1.07) translateY(-8px); filter: saturate(1.3) brightness(1.15);
  transition: opacity 0.45s cubic-bezier(0.34,1.56,0.64,1), transform 0.45s cubic-bezier(0.34,1.56,0.64,1), filter 0.45s ease;
}
.vendor-card.lit .logo-ring { border-color: var(--accent) !important; box-shadow: 0 0 0 4px rgba(255,255,255,0.1), 0 0 32px 8px rgba(255,255,255,0.1); }
.vendor-card.lit .vendor-name { color: #fff; text-shadow: 0 0 20px rgba(255,255,255,0.3); }

/* LOGO */
.logo-shell { position: relative; width: 230px; height: 230px; flex-shrink: 0; }
.vendors-grid.count-2 .logo-shell { width: 290px; height: 290px; }
.logo-ring { position: absolute; inset: -4px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.08); transition: border-color 0.45s ease, box-shadow 0.45s ease; }
.logo-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; background: #1C1C1C; }
.logo-img[src*="supplier-logo-391"] { background: #ffffff; }
.logo-fallback {
  display: none; width: 100%; height: 100%; border-radius: 50%;
  background: rgba(255,255,255,0.06); border: 2px solid rgba(255,255,255,0.12);
  align-items: center; justify-content: center;
  font-family: 'Bebas Neue', sans-serif; font-size: 88px; color: var(--accent); letter-spacing: 0.04em;
}
.vendors-grid.count-2 .logo-fallback { font-size: 110px; }
.vendor-name { font-size: 28px; font-weight: 800; color: rgba(255,255,255,0.65); text-align: center; line-height: 1.1; letter-spacing: -0.02em; transition: color 0.45s ease, text-shadow 0.45s ease; }
.vendors-grid.count-2 .vendor-name { font-size: 34px; }

/* BOTTOM BAR */
.bottom-bar { flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 28px 80px 48px; }
.time-info { font-size: 19px; color: #ffffff; font-weight: 800; letter-spacing: 0.04em; }
.dots { display: flex; gap: 10px; align-items: center; }
.dot { height: 8px; width: 8px; border-radius: 4px; background: rgba(255,255,255,0.18); transition: width 0.4s ease, background 0.4s ease; }
.dot.on { background: var(--accent); width: 28px; }

/* TIMER BAR */
#timer-bar { position: fixed; bottom: 0; left: 0; height: 3px; width: 0; border-radius: 0 2px 0 0; }

/* LOADING */
#loader { position: fixed; inset: 0; background: #0C0C0C; display: flex; align-items: center; justify-content: center; z-index: 99; transition: opacity 0.5s ease; }
#loader svg { height: 32px; opacity: 0.3; }

/* RIPPLE */
@keyframes ripple { from { transform: translate(-50%,-50%) scale(0); opacity: 0.45; } to { transform: translate(-50%,-50%) scale(3.5); opacity: 0; } }
.ripple-dot { position: fixed; width: 80px; height: 80px; border-radius: 50%; background: rgba(255,255,255,0.12); pointer-events: none; animation: ripple 0.55s ease-out forwards; }
</style>
</head>

// Day accent palette ÃÂÃÂÃÂÃÂ¢ÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂ cycles if more than 3 days
const ACCENTS = ['#FF4347','#00C8DC','#C850FF','#FF8C00','#00D68F'];

const SLIDE_DURATION = 12000;
const SPOT_DURATION  = 2000;
const SPOT_INTRO     = 900;

let DAYS = [], WEEK_LABEL = '';
let current = 0, spotTimer = null, autoTimer = null, barRAF = null, barStart = null;

function initials(name) {
  return name.replace(/[^a-zA-Z\s]/g,'').trim()
    .split(/\s+/).slice(0,2).map(w=>w[0]?.toUpperCase()||'').join('');
}

function buildSlides() {
  const stage    = document.getElementById('stage');
  const timerBar = document.getElementById('timer-bar');
  stage.innerHTML = '';

  DAYS.forEach((day, idx) => {
    const accent = ACCENTS[idx % ACCENTS.length];
    const n = day.vendors.length;
    const slide = document.createElement('div');
    slide.className = 'slide';
    slide.dataset.idx = idx;
    slide.dataset.accent = accent;
    slide.style.setProperty('--accent', accent);
    slide.style.background = `radial-gradient(ellipse 70% 55% at 50% 42%, ${accent}22 0%, #0C0C0C 68%)`;

    const vendorHTML = day.vendors.map(v => `
      <div class="vendor-card">
        <div class="logo-shell">
          <div class="logo-ring"></div>
          <img class="logo-img" src="${v.logo}" alt="${v.name}" style="background:${v.bg||'#1C1C1C'}"
               onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
          <div class="logo-fallback">${initials(v.name)}</div>
        </div>
        <div class="vendor-name">${v.name}</div>
      </div>`).join('');

    const dotsHTML = DAYS.map((_,di) =>

function fitDayNames() {
  const maxW = 1080 - 160;
  document.querySelectorAll('.day-name').forEach(el => {
    el.style.fontSize = '230px';

    if (w > maxW) el.style.fontSize = Math.floor(230 * maxW / w) + 'px';
  });
}

function clearSpotlight() {
  clearInterval(spotTimer); spotTimer = null;
  document.querySelectorAll('.vendor-card.lit').forEach(c => c.classList.remove('lit'));
}
function runSpotlight(cards) {
  let si = 0;
  clearInterval(spotTimer);
  const shine = () => {
    cards.forEach(c => c.classList.remove('lit'));
    cards[si].classList.add('lit');
    si = (si + 1) % cards.length;
  };
  shine();
  spotTimer = setInterval(shine, SPOT_DURATION);
}

function enterVendors(slide) {
  const cards = Array.from(slide.querySelectorAll('.vendor-card'));
  cards.forEach(c => { c.classList.remove('popping','lit'); c.classList.add('entering'); });
  cards.forEach((card, i) => setTimeout(() => {
    card.classList.remove('entering'); card.classList.add('popping');
  }, 200 + i * 220));

const timerBar = document.getElementById('timer-bar');

function activateSlide(idx) {
  const slides = Array.from(document.querySelectorAll('.slide'));
  if (!slides.length) return;
  clearSpotlight();

  const prev = current;
  slides[prev].classList.remove('active');
  slides[prev].classList.add('leaving');
  setTimeout(() => slides[prev].classList.remove('leaving'), 500);

  current = ((idx % DAYS.length) + DAYS.length) % DAYS.length;
  const next = slides[current];
  next.classList.add('active');

  timerBar.style.background = next.dataset.accent;
  enterVendors(next);

  cancelAnimationFrame(barRAF);
  timerBar.style.transition = 'none'; timerBar.style.width = '0%'; barStart = null;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    barStart = performance.now();
    const tick = now => {
      const pct = Math.min((now-barStart)/SLIDE_DURATION*100, 100);
      timerBar.style.width = pct + '%';
      if (pct < 100) barRAF = requestAnimationFrame(tick);
    };
    barRAF = requestAnimationFrame(tick);
  }));
}

function advance() {
  clearTimeout(autoTimer);
  activateSlide(current + 1);
  autoTimer = setTimeout(advance, SLIDE_DURATION);
}

document.getElementById('stage').addEventListener('click', e => {
  const r = document.createElement('div');
  r.className = 'ripple-dot';
  r.style.left = e.clientX+'px'; r.style.top = e.clientY+'px';
  document.body.appendChild(r);
  r.addEventListener('animationend', () => r.remove());
  clearTimeout(autoTimer); activateSlide(current+1); autoTimer = setTimeout(advance, SLIDE_DURATION);
});
